[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[lib]
name = "frontend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
chrono = "0.4.45"
dotenvy = "0.15.7"
keyring = "4.2.0"
reqwest = "0.13.5"
serde = "1.0.229"
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
thiserror = "2.0.21"
tokio = "1.54.1"
